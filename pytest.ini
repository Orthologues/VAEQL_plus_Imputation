[pytest]
# Run package tests when invoking `pytest` from repository root.
testpaths = VAEQL_plus/tests
# Collect canonical tests and smoke-test modules.
python_files = *_test.py *_tests.py
# Collect class-style tests such as `Module_import_test`.
python_classes = *_test
# Keep concise output with skip/xfail summary and show smoke-test print output.
addopts = -q -ra -s
