name: ml_env
channels:
  - pytorch
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy
  - pandas
  - scikit-learn
  - pytorch
  - torchvision
  - torchaudio
  - cpuonly

  - pip:
      - gensim
      - notebook
      - nltk
      - pytest
      - pyampute
      - stable-baselines3
      - ucimlrepo
      - mlflow
